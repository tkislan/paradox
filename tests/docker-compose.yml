# Isolated Mosquitto brokers for the test suite. The bridge hard-codes its topics, so tests that run in
# parallel cannot share a broker; each test leases one of these instances (see mosquitto.js).
name: paradox-tests

services:
  mosquitto:
    image: eclipse-mosquitto:2
    deploy:
      replicas: ${MOSQUITTO_REPLICAS:-24}
    ports:
      - "1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # dynsec init creates the admin account the suite manages test users with; mosquitto drops to
    # its own user after startup and must be able to read and update the file.
    command: >
      sh -c "mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json admin admin-secret >/dev/null &&
             chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-u", "admin", "-P", "admin-secret", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      # Fast checks only while starting (so `up --wait` returns quickly); afterwards the check would
      # only add a connect/disconnect pair to every broker log.
      start_period: 30s
      start_interval: 500ms
      interval: 1h
      timeout: 4s
      retries: 3
    restart: "no"
