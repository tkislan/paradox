listener 1883
allow_anonymous false
persistence false

# The suite reads connects, subscriptions and client publishes (qos, retain) from this log.
log_dest stdout
log_type all
connection_messages true

# Test users and ACLs are created on the fly through the dynamic security plugin.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
