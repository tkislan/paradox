name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to master must not cancel the run that is publishing the previous one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Compiles src/ and runs the tests with coverage.
      - run: npm test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      # Only to run the arm64 image for the smoke test; building it needs no emulation.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile type-checks (flow) and compiles the sources, so a failing build is a failing check.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: paradox-bridge:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Image runs on ${{ matrix.platform }} and finds its dependencies
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker run --rm --platform "$PLATFORM" --entrypoint node paradox-bridge:ci -p process.arch)
          test "$arch" = "$EXPECTED_ARCH"
          docker run --rm --platform "$PLATFORM" --entrypoint node paradox-bridge:ci \
            -e "for (const name of ['axios', 'express', 'mqtt']) require(name); console.log('dependencies load')"
          # Without its environment the bridge must stop at the config check, before touching any network.
          status=0
          output=$(docker run --rm --platform "$PLATFORM" paradox-bridge:ci 2>&1) || status=$?
          echo "$output"
          test "$status" = 1
          grep -q 'Missing enviromnent variable' <<<"$output"

  # Pushes the image to Docker Hub for commits that land on master; pull requests never run this job and never see
  # the secret. Tagged 1.0.<run number> only, there is deliberately no latest tag. The commit is in the image
  # (label org.opencontainers.image.revision, per platform) and on the multi-platform index (the same annotation).
  publish:
    if: github.event_name == 'push'
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: tkislan/paradox
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: tkislan
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Image tag, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
      # No emulation needed: the stages that run commands are pinned to amd64, the final stage only copies.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=image
      - name: The pushed image says which commit it was built from
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          label=org.opencontainers.image.revision
          docker buildx imagetools inspect "$REF" --format '{{json .Image}}' > image.json
          docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Annotations}}' > annotations.json
          for platform in linux/amd64 linux/arm64; do
            test "$(jq -r --arg p "$platform" --arg l "$label" '.[$p].config.Labels[$l]' image.json)" = "$GITHUB_SHA"
          done
          test "$(jq -r --arg l "$label" '.[$l]' annotations.json)" = "$GITHUB_SHA"
